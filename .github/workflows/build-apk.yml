name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      # Temuan analyzer ditampilkan sebagai anotasi supaya langsung terlihat
      # di tab Checks tanpa harus membuka log mentah.
      - name: Laporkan temuan analyzer
        if: always()
        run: |
          [ -s analyze.log ] || exit 0
          findings="$(grep -E '^ *(error|warning|info) ' analyze.log | head -10 || true)"
          [ -n "$findings" ] || exit 0
          while IFS= read -r line; do
            echo "::error::$line"
          done <<< "$findings"

      - name: Test
        run: flutter test

  build-apk:
    name: Build ${{ matrix.name }} APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            args: --debug
            artifact: music-debug-apk
          - name: release
            args: --release
            artifact: music-release-apk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk ${{ matrix.args }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
